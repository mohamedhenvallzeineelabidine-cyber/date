<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Would you date with me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep: #2b1116;
    --wine-rich: #4a1b24;
    --gold: #c9a26d;
    --gold-soft: #e3c99a;
    --blush: #e8b4b8;
    --ivory: #f6eae0;
    --sage: #9cae8c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
  }

  body{
    background: radial-gradient(120% 140% at 50% 0%, var(--wine-rich) 0%, var(--wine-deep) 60%, #200d11 100%);
    color: var(--ivory);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- romantic glow ---------- */
  .glow{
    position: fixed;
    top: 46%;
    left: 50%;
    width: 70vmax;
    height: 70vmax;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(232,180,184,0.22) 0%, rgba(201,162,109,0.10) 40%, rgba(232,180,184,0) 72%);
    pointer-events: none;
    z-index: 0;
    animation: pulse-glow 9s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
  }

  /* ---------- ambient floating petals + sparkles ---------- */
  .ambient{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .petal{
    position: absolute;
    bottom: -10%;
    font-size: 20px;
    color: var(--blush);
    opacity: 0.45;
    animation: drift linear infinite;
    will-change: transform;
  }
  @keyframes drift{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.45; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-115vh) translateX(var(--drift-x, 40px)) rotate(200deg); opacity: 0; }
  }

  .sparkle{
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold-soft);
    box-shadow: 0 0 6px 1px rgba(227, 201, 154, 0.85);
    opacity: 0;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: 0.9; transform: scale(1.3); }
  }

  /* ---------- stage / screens ---------- */
  .stage{
    position: relative;
    z-index: 2;
    height: 100vh;
    height: 100dvh;
    width: 100%;
  }

  .screen{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 8vh 8vw;
    text-align: center;
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .screen.active{
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .headline{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2rem, 7vw, 3.4rem);
    line-height: 1.25;
    margin: 0;
    max-width: 14ch;
    color: var(--ivory);
  }
  .headline.arabic{
    font-family: 'Amiri', serif;
    font-style: normal;
    font-weight: 700;
    line-height: 1.6;
    max-width: 16ch;
  }
  .headline.celebrate{
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 4rem);
  }

  .ornament{
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .sub{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.15rem, 4vw, 1.5rem);
    color: var(--gold-soft);
    margin: -18px 0 0 0;
  }
  .sub-en{
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: var(--blush);
    margin: 0;
  }

  /* ---------- choices ---------- */
  .choices{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    min-height: 70px;
    width: 100%;
  }

  .btn{
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 16px 40px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, left 0.28s cubic-bezier(.2,.9,.3,1.3), top 0.28s cubic-bezier(.2,.9,.3,1.3);
    -webkit-tap-highlight-color: transparent;
  }
  .btn.arabic{ font-family: 'Amiri', serif; font-size: 1.15rem; }

  .btn-yes{
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: var(--wine-deep);
    box-shadow: 0 8px 24px rgba(201, 162, 109, 0.35);
  }
  .btn-yes:hover{ transform: translateY(-2px); }
  .btn-yes:active{ transform: translateY(0); }

  .btn-no{
    background: transparent;
    color: var(--ivory);
    border: 1px solid rgba(246, 234, 224, 0.35);
  }
  .btn-no.dodging{
    position: fixed;
    z-index: 5;
  }

  .date-input{
    font-family: 'Inter', sans-serif;
    font-size: 1.05rem;
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(246, 234, 224, 0.35);
    background: rgba(246, 234, 224, 0.06);
    color: var(--ivory);
    outline: none;
    color-scheme: dark;
  }
  .date-input:focus{ border-color: var(--gold); }

  /* ---------- confetti ---------- */
  .confetti-layer{
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .confetti{
    position: absolute;
    top: -5%;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(540deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .petal, .confetti{ animation: none !important; display: none; }
    .btn{ transition: none; }
  }

  :focus-visible{
    outline: 2px solid var(--gold-soft);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="ambient" id="ambient"></div>

<main class="stage">

  <section class="screen active" data-screen="1" id="screen1">
    <h1 class="headline">Iman, would you date with me?</h1>
    <div class="ornament"></div>
    <div class="choices">
      <button class="btn btn-yes" id="yes1">Yes</button>
      <button class="btn btn-no" id="no1">No</button>
    </div>
  </section>

  <section class="screen" data-screen="2" dir="rtl" lang="ar" id="screen2">
    <h1 class="headline arabic">هل تحبينني يا إيمان؟</h1>
    <div class="ornament"></div>
    <div class="choices">
      <button class="btn btn-yes arabic" id="yes2">نعم</button>
      <button class="btn btn-no arabic" id="no2">لا</button>
    </div>
  </section>

  <section class="screen" data-screen="3" dir="rtl" lang="ar" id="screen3">
    <h1 class="headline arabic">اختاري تاريخ زفافنا يا إيمان 💍</h1>
    <div class="ornament"></div>
    <input type="date" id="weddingDate" class="date-input">
    <button class="btn btn-yes arabic" id="confirmDate">تأكيد</button>
  </section>

  <section class="screen" data-screen="4" id="screen4">
    <div class="confetti-layer" id="confettiLayer"></div>
    <h1 class="headline celebrate">🎉 مبروك يا إيمان 🎉</h1>
    <p class="sub">Félicitations, mon amour</p>
    <p class="sub-en" id="dateEcho"></p>
  </section>

</main>

<script>
(function(){
  // ---------- ambient petals ----------
  const ambient = document.getElementById('ambient');
  const petalChars = ['♥','❀','✿'];
  for(let i=0;i<10;i++){
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = petalChars[i % petalChars.length];
    p.style.left = (Math.random()*100) + 'vw';
    p.style.setProperty('--drift-x', (Math.random()*80-40)+'px');
    p.style.animationDuration = (14 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*12) + 's';
    p.style.fontSize = (14 + Math.random()*14) + 'px';
    ambient.appendChild(p);
  }

  for(let i=0;i<26;i++){
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.top = (Math.random()*100) + 'vh';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    s.style.animationDelay = (Math.random()*5) + 's';
    ambient.appendChild(s);
  }

  // ---------- screen navigation ----------
  function goTo(n){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelector('[data-screen="'+n+'"]').classList.add('active');
  }

  // ---------- dodging "no" buttons ----------
  function setupDodge(btn){
    const margin = 60;

    function randomSpot(){
      const w = btn.offsetWidth || 120;
      const h = btn.offsetHeight || 50;
      const maxX = window.innerWidth - w - margin;
      const maxY = window.innerHeight - h - margin;
      const x = margin + Math.random() * Math.max(1, maxX - margin);
      const y = margin + Math.random() * Math.max(1, maxY - margin);
      return {x, y};
    }

    function moveAway(){
      const {x, y} = randomSpot();
      btn.classList.add('dodging');
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function nearButton(clientX, clientY){
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dist = Math.hypot(cx - clientX, cy - clientY);
      return dist < 110;
    }

    function onPointerMove(e){
      if (!btn.closest('.screen').classList.contains('active')) return;
      const point = e.touches ? e.touches[0] : e;
      if (nearButton(point.clientX, point.clientY)) moveAway();
    }

    document.addEventListener('mousemove', onPointerMove, {passive:true});
    document.addEventListener('touchmove', onPointerMove, {passive:true});

    btn.addEventListener('touchstart', function(e){
      e.preventDefault();
      moveAway();
    }, {passive:false});

    // belt-and-suspenders: even if clicked, it never proceeds
    btn.addEventListener('click', function(e){
      e.preventDefault();
      moveAway();
    });
  }

  setupDodge(document.getElementById('no1'));
  setupDodge(document.getElementById('no2'));

  // reset "no" buttons to normal flow position whenever we leave a screen
  document.querySelectorAll('.btn-no').forEach(btn => {
    btn.style.position = '';
  });

  // ---------- flow ----------
  document.getElementById('yes1').addEventListener('click', () => goTo(2));
  document.getElementById('yes2').addEventListener('click', () => goTo(3));

  document.getElementById('confirmDate').addEventListener('click', () => {
    const input = document.getElementById('weddingDate');
    const echo = document.getElementById('dateEcho');
    if (input.value){
      const d = new Date(input.value + 'T00:00:00');
      const formatted = d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
      echo.textContent = 'Notre date : ' + formatted + ' 💍';
    } else {
      echo.textContent = '';
    }
    goTo(4);
    launchConfetti();
  });

  // ---------- confetti ----------
  function launchConfetti(){
    const layer = document.getElementById('confettiLayer');
    layer.innerHTML = '';
    const colors = ['#c9a26d','#e3c99a','#e8b4b8','#f6eae0','#9cae8c'];
    for(let i=0;i<70;i++){
      const c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.5 + Math.random()*2) + 's';
      c.style.animationDelay = (Math.random()*0.8) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      layer.appendChild(c);
    }
  }
})();
</script>

</body>
</html>
